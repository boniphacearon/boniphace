<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BONIPHACE - AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }
    #sidebar {
      width: 280px;
      background: #141414;
      border-right: 1px solid #2a2a2a;
      padding: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: #6EE7B7;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2a2a2a;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6EE7B7 0%, #34D399 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a0a0a;
      font-weight: 900;
      font-size: 24px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 4px 0;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      border: none;
      color: #f5f5f5;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }
    .nav-item:hover { background: #262626; }
    .nav-item.active { background: rgba(110, 231, 183, 0.1); color: #6EE7B7; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #header {
      padding: 20px 24px;
      border-bottom: 1px solid #2a2a2a;
      background: #141414;
    }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: #6EE7B7;
    }
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6EE7B7 0%, #34D399 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #0a0a0a;
      margin-bottom: 24px;
    }
    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #6EE7B7;
    }
    .welcome-subtitle {
      font-size: 16px;
      color: #a3a3a3;
      margin-bottom: 32px;
    }
    .messages-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      padding: 20px;
      border-radius: 12px;
      background: #141414;
      border: 1px solid #2a2a2a;
    }
    .message.user {
      background: #1c1c1c;
      border-left: 3px solid #6EE7B7;
    }
    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .message.user .message-avatar { background: #6EE7B7; color: #0a0a0a; }
    .message.assistant .message-avatar {
      background: linear-gradient(135deg, #6EE7B7 0%, #34D399 100%);
      color: #0a0a0a;
    }
    .message-role {
      font-size: 13px;
      font-weight: 600;
      color: #6EE7B7;
    }
    .message-content {
      font-size: 15px;
      line-height: 1.6;
      color: #f5f5f5;
      white-space: pre-wrap;
    }
    #input-area {
      padding: 20px 24px;
      border-top: 1px solid #2a2a2a;
      background: #141414;
    }
    .input-container {
      max-width: 800px;
      margin: 0 auto;
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
    }
    #message-input {
      width: 100%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #f5f5f5;
      font-size: 15px;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 24px;
    }
    .send-btn {
      background: linear-gradient(135deg, #6EE7B7 0%, #34D399 100%);
      color: #0a0a0a;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
    }
    .send-btn:hover { opacity: 0.9; }
    .hidden { display: none !important; }
    .view { display: none; height: 100%; }
    .view.active { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="brand">
        <div class="brand-icon">B</div>
        BONIPHACE
      </div>
      <button class="nav-item active" onclick="showView('chat')">💬 Chat</button>
      <button class="nav-item" onclick="showView('dashboard')">📊 Dashboard</button>
      <button class="nav-item" onclick="showView('memory')">🧠 Memory</button>
      <button class="nav-item" onclick="showView('settings')">️ Settings</button>
    </div>
    <div id="main">
      <div id="header">
        <div class="header-title">BONIPHACE — Your Personal AI Assistant</div>
      </div>
      
      <div id="chat-view" class="view active">
        <div id="chat-area">
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-icon">B</div>
            <div class="welcome-title">Welcome to BONIPHACE!</div>
            <div class="welcome-subtitle">How can I help you today?</div>
          </div>
          <div class="messages-container hidden" id="messages-container"></div>
        </div>
        <div id="input-area">
          <div class="input-container">
            <textarea id="message-input" rows="1" placeholder="Ask BONIPHACE anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button class="send-btn" onclick="sendMessage()">Send Message</button>
          </div>
        </div>
      </div>
      
      <div id="dashboard-view" class="view">
        <div style="padding:24px;"><h2>Dashboard</h2><p style="color:#a3a3a3;margin-top:12px;">Statistics will appear here.</p></div>
      </div>
      
      <div id="memory-view" class="view">
        <div style="padding:24px;"><h2>Memory</h2><p style="color:#a3a3a3;margin-top:12px;">Your memories will appear here.</p></div>
      </div>
      
      <div id="settings-view" class="view">
        <div style="padding:24px;"><h2>Settings</h2><p style="color:#a3a3a3;margin-top:12px;">Settings will appear here.</p></div>
      </div>
    </div>
  </div>

  <script>
    let messageHistory = [];
    
    function showView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(view + '-view').classList.add('active');
      event.target.classList.add('active');
    }
    
    function addMessage(role, content) {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('messages-container').classList.remove('hidden');
      
      const container = document.getElementById('messages-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + role;
      
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      msgDiv.innerHTML = `
        <div class="message-header">
          <div class="message-avatar">${role === 'user' ? 'U' : 'B'}</div>
          <div class="message-role">${role === 'user' ? 'You' : 'BONIPHACE'}</div>
          <div style="margin-left:auto;font-size:12px;color:#a3a3a3;">${time}</div>
        </div>
        <div class="message-content">${content}</div>
      `;
      
      container.appendChild(msgDiv);
      document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
    }
    
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      
      // Add user message
      addMessage('user', text);
      messageHistory.push({ role: 'user', content: text });
      input.value = '';
      
      // Show typing indicator
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="message-header">
          <div class="message-avatar">B</div>
          <div class="message-role">BONIPHACE</div>
        </div>
        <div class="message-content">Thinking...</div>
      `;
      document.getElementById('messages-container').appendChild(typingDiv);
      document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
      
      // Simulate AI response (replace this with real AI later)
      setTimeout(() => {
        typingDiv.remove();
        
        // Simple response logic
        let reply = '';
        const lowerText = text.toLowerCase();
        
        if (lowerText.includes('hello') || lowerText.includes('hi')) {
          reply = 'Hello! How can I assist you today?';
        } else if (lowerText.includes('how are you')) {
          reply = "I'm doing well, thank you! How can I help you?";
        } else if (lowerText.includes('name')) {
          reply = 'I am BONIPHACE, your personal AI assistant.';
        } else if (lowerText.includes('help')) {
          reply = 'I can help you with:\n- Answering questions\n- Providing information\n- Having conversations\n- And much more!\n\nWhat would you like to know?';
        } else if (lowerText.includes('thank')) {
          reply = "You're welcome! Feel free to ask me anything.";
        } else {
          reply = `I received your message: "${text}"\n\nThis is a demo response. To enable full AI capabilities, we need to integrate with an AI service like OpenAI, Puter, or others.\n\nFor now, try asking:\n- "Hello"\n- "How are you?"\n- "What is your name?"\n- "Help"`;
        }
        
        addMessage('assistant', reply);
        messageHistory.push({ role: 'assistant', content: reply });
      }, 1000);
    }
  </script>
</body>
</html>

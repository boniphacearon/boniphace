<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>BONIPHACE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-primary: #1a1a1a; --bg-secondary: #252525; --bg-tertiary: #2a2a2a;
      --text-primary: #f5f5f5; --text-secondary: #a3a3a3; --accent: #d97757;
      --accent-hover: #c96747; --border: #333333; --success: #10b981;
    }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; font-size: 16px; line-height: 1.5; }
    #app { display: flex; flex-direction: column; height: 100vh; position: relative; }
    #header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-primary); border-bottom: 1px solid var(--border); }
    .menu-btn { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; padding: 4px; }
    .logo { font-size: 20px; font-weight: 600; color: var(--text-primary); }
    .profile-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; cursor: pointer; }
    #main { flex: 1; overflow-y: auto; position: relative; }
    .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px 20px; text-align: center; }
    .welcome-logo { width: 64px; height: 64px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .welcome-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .welcome-subtitle { font-size: 16px; color: var(--text-secondary); }
    .messages-container { max-width: 800px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 12px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }
    .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .message.user .message-avatar { background: var(--accent); color: white; }
    .message.assistant .message-avatar { background: var(--accent); color: white; }
    .message-content { flex: 1; background: var(--bg-secondary); padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.6; color: var(--text-primary); max-width: calc(100% - 60px); word-wrap: break-word; }
    .message.user .message-content { background: var(--bg-tertiary); }
    .message-content p { margin: 8px 0; }
    .message-content p:first-child { margin-top: 0; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content code { background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-family: "SF Mono", Consolas, monospace; font-size: 14px; }
    .message-content pre { background: var(--bg-primary); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
    .message-content pre code { background: none; padding: 0; }
    .thought-process { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
    .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.4s infinite ease-in-out; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    #input-area { background: var(--bg-primary); border-top: 1px solid var(--border); padding: 16px; }
    .input-container { max-width: 800px; margin: 0 auto; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; align-items: flex-end; gap: 8px; }
    #message-input { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 16px; resize: none; outline: none; font-family: inherit; min-height: 24px; max-height: 200px; line-height: 1.5; }
    #message-input::placeholder { color: var(--text-secondary); }
    .input-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.2s; }
    .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .send-btn { background: var(--accent); color: white; width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; }
    .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .model-selector { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-tertiary); border-radius: 8px; font-size: 14px; color: var(--text-secondary); cursor: pointer; }
    .model-selector:hover { background: var(--border); }
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; background: var(--bg-primary); border-right: 1px solid var(--border); padding: 16px; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 1000; overflow-y: auto; }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .sidebar-title { font-size: 24px; font-weight: 700; }
    .close-sidebar { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; }
    .sidebar-section { margin-bottom: 24px; }
    .sidebar-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; padding: 0 8px; }
    .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-primary); font-size: 14px; transition: background 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item:hover { background: var(--bg-secondary); }
    .sidebar-item.active { background: var(--bg-secondary); }
    .sidebar-icon { font-size: 18px; width: 24px; }
    .new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; cursor: pointer; margin-bottom: 24px; transition: all 0.2s; }
    .new-chat-btn:hover { background: var(--bg-tertiary); }
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
    .overlay.active { opacity: 1; pointer-events: all; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    @media (max-width: 768px) { #sidebar { width: 280px; } .messages-container { padding: 16px 12px; } .message-content { max-width: calc(100% - 50px); font-size: 15px; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="logo">BONIPHACE</div>
      <div class="profile-icon">B</div>
    </div>
    <div id="main">
      <div class="welcome-screen" id="welcome-screen">
        <svg class="welcome-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" stroke="#d97757" stroke-width="4" fill="none"/>
          <line x1="32" y1="4" x2="32" y2="12" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="32" y1="52" x2="32" y2="60" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="4" y1="32" x2="12" y2="32" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="52" y1="32" x2="60" y2="32" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="11.5" y1="11.5" x2="17.1" y2="17.1" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="46.9" y1="46.9" x2="52.5" y2="52.5" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="11.5" y1="52.5" x2="17.1" y2="46.9" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
          <line x1="46.9" y1="17.1" x2="52.5" y2="11.5" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="welcome-title">Welcome, Boniphace</div>
        <div class="welcome-subtitle">How can I help you today?</div>
      </div>
      <div class="messages-container hidden" id="messages-container"></div>
    </div>
    <div id="input-area">
      <div class="input-container">
        <div class="input-row">
          <textarea id="message-input" rows="1" placeholder="Message BONIPHACE..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()" id="send-btn">↑</button>
        </div>
        <div class="input-actions">
          <button class="icon-btn" title="Attach file">📎</button>
          <button class="icon-btn" title="Voice input">🎤</button>
          <div class="model-selector">Sonnet 5 Medium</div>
        </div>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">BONIPHACE</div>
      <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <span>+</span>
      <span>New chat</span>
    </button>
    <div class="sidebar-section">
      <div class="sidebar-label">Recents</div>
      <div id="recent-chats"></div>
    </div>
  </div>
<script>
    let messageHistory = [];
    let recentChats = [];
    
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }
    
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
    }
    
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }
    
    function addMessage(role, content, thoughtTime = null) {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('messages-container').classList.remove('hidden');
      const container = document.getElementById('messages-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + role;
      let html = `<div class="message-avatar">${role === 'user' ? 'B' : '✦'}</div><div class="message-content">`;
      if (thoughtTime && role === 'assistant') { html += `<div class="thought-process">Thought for ${thoughtTime}s</div>`; }
      html += `<div>${formatMessage(content)}</div></div>`;
      msgDiv.innerHTML = html;
      container.appendChild(msgDiv);
      document.getElementById('main').scrollTop = document.getElementById('main').scrollHeight;
    }
    
    function formatMessage(text) {
      if (!text) return '';
      text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      text = text.replace(/\n/g, '</p><p>');
      return text;
    }
    
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      addMessage('user', text);
      messageHistory.push({ role: 'user', content: text });
      input.value = '';
      input.style.height = 'auto';
      
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `<div class="message-avatar">✦</div><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
      document.getElementById('messages-container').appendChild(typingDiv);
      document.getElementById('main').scrollTop = document.getElementById('main').scrollHeight;
      
      const startTime = Date.now();
      setTimeout(() => {
        typingDiv.remove();
        const thoughtTime = ((Date.now() - startTime) / 1000).toFixed(0);
        let reply = generateResponse(text);
        addMessage('assistant', reply, thoughtTime);
        messageHistory.push({ role: 'assistant', content: reply });
        if (messageHistory.length === 2) { addToRecentChats(text); }
      }, 1000 + Math.random() * 1000);
    }
    
    function generateResponse(userMessage) {
      const lower = userMessage.toLowerCase();
      if (lower.includes('hello') || lower.includes('hi ')) return "Hello! How can I assist you today?";
      else if (lower.includes('how are you')) return "I'm doing well, thank you! How can I help you?";
      else if (lower.includes('name')) return "I am BONIPHACE, your personal AI assistant.";
      else if (lower.includes('what is computing')) return `<p><strong>Computing</strong> is the process of using computers or computational systems to store, process, transform, and communicate information. At its core, it involves:</p><p>• <strong>Input</strong> - receiving data (numbers, text, images, sensor readings, etc.)</p><p>• <strong>Processing</strong> - performing operations on that data using logic and mathematics</p><p>• <strong>Storage</strong> - saving data and instructions for later use</p><p>• <strong>Output</strong> - producing results (displaying, printing, sending, or acting on them)</p><p>More broadly, computing covers everything from the theoretical foundations (algorithms, computability, information theory) to the practical fields built on top of it — software development, hardware engineering, networking, databases, artificial intelligence, and cybersecurity.</p>`;
      else if (lower.includes('help')) return "I can help you with:\n• Answering questions\n• Providing information\n• Having conversations\n• Writing and editing\n• Coding assistance\n• And much more!\n\nWhat would you like to know?";
      else if (lower.includes('thank')) return "You're welcome! Feel free to ask me anything.";
      else return `<p>I received your message: "${userMessage}"</p><p>This is a demo response. To enable full AI capabilities with real intelligence like Claude, you would need to integrate with an AI service API.</p><p>For now, try asking:\n• "What is computing?"\n• "Hello"\n• "How are you?"\n• "Help"</p>`;
    }
    
    function addToRecentChats(title) {
      recentChats.unshift({ title: title.substring(0, 40), timestamp: new Date() });
      if (recentChats.length > 10) recentChats.pop();
      renderRecentChats();
    }
    
    function renderRecentChats() {
      const container = document.getElementById('recent-chats');
      if (recentChats.length === 0) { container.innerHTML = '<div style="color: var(--text-secondary); padding: 8px 12px; font-size: 14px;">No recent chats</div>'; return; }
      container.innerHTML = recentChats.map((chat, index) => `<div class="sidebar-item ${index === 0 ? 'active' : ''}" onclick="loadChat(${index})"><span class="sidebar-icon">•</span><span>${chat.title}</span></div>`).join('');
    }
    
    function loadChat(index) { toggleSidebar(); }
    function newChat() {
      messageHistory = [];
      document.getElementById('messages-container').innerHTML = '';
      document.getElementById('messages-container').classList.add('hidden');
      document.getElementById('welcome-screen').classList.remove('hidden');
      toggleSidebar();
    }
    renderRecentChats();
  </script>
</body>
</html>

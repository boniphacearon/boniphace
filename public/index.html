<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>BONIPHACE - Your Personal AI Assistant</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }
    #sidebar {
      width: 280px;
      background: #141414;
      border-right: 1px solid #262626;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #6EE7B7;
      margin-bottom: 24px;
    }
    .nav-item {
      padding: 10px;
      margin: 4px 0;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      border: none;
      color: #f5f5f5;
      text-align: left;
      font-size: 14px;
    }
    .nav-item:hover { background: #1c1c1c; }
    .nav-item.active { background: #1c1c1c; color: #6EE7B7; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #header {
      padding: 16px;
      border-bottom: 1px solid #262626;
      background: #141414;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    #input-area {
      padding: 16px;
      border-top: 1px solid #262626;
      background: #141414;
    }
    #message-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #262626;
      background: #1c1c1c;
      color: #f5f5f5;
      font-size: 14px;
      resize: none;
    }
    .send-btn {
      background: #6EE7B7;
      color: #0a0a0a;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .message {
      max-width: 800px;
      margin: 0 auto 16px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #141414;
      border: 1px solid #262626;
    }
    .message.user { background: #1c1c1c; }
    .message .role {
      font-size: 11px;
      text-transform: uppercase;
      color: #6EE7B7;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .hidden { display: none !important; }
    .view { display: none; height: 100%; }
    .view.active { display: block; }
  </style>
  
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="brand">
        <div style="width:32px;height:32px;background:#6EE7B7;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-weight:bold;">B</div>
        BONIPHACE
      </div>
      <button class="nav-item active" onclick="showView('chat')">💬 Chat</button>
      <button class="nav-item" onclick="showView('dashboard')">📊 Dashboard</button>
      <button class="nav-item" onclick="showView('memory')">🧠 Memory</button>
      <button class="nav-item" onclick="showView('settings')">⚙️ Settings</button>
    </div>
    
    <div id="main">
      <div id="header">
        <h2>BONIPHACE — Your Personal AI Assistant</h2>
      </div>
      
      <div id="chat-area" class="view active">
        <div id="messages"></div>
      </div>
      
      <div id="dashboard-view" class="view">
        <div style="padding:20px;"><h2>Dashboard</h2></div>
      </div>
      
      <div id="memory-view" class="view">
        <div style="padding:20px;"><h2>Memory</h2></div>
      </div>
      
      <div id="settings-view" class="view">
        <div style="padding:20px;"><h2>Settings</h2></div>
      </div>
      
      <div id="input-area">
        <textarea id="message-input" rows="2" placeholder="Ask BONIPHACE anything..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('bp_token');
    
    async function boot() {
      if (!token) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'admin', password: 'admin123' })
          });
          const data = await res.json();
          if (res.ok) {
            token = data.token;
            localStorage.setItem('bp_token', token);
          }
        } catch(e) { console.error(e); }
      }
      
      if (token) {
        addMessage('assistant', 'Welcome to BONIPHACE! How can I help you today?');
      }
    }
    
    function showView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      if (view === 'chat') {
        document.getElementById('chat-area').classList.add('active');
      } else {
        document.getElementById(view + '-view').classList.add('active');
      }
      event.target.classList.add('active');
    }
    
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerHTML = '<div class="role">' + (role === 'user' ? 'You' : 'BONIPHACE') + '</div><div class="content">' + content + '</div>';
      document.getElementById('messages').appendChild(div);
      document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
    }
    
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      
      addMessage('user', text);
      input.value = '';
      
      try {
        const res = await fetch('/api/conversations', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        
        // Use Puter AI
        const response = await puter.ai.chat(text);
        addMessage('assistant', typeof response === 'string' ? response : response.message?.content || 'Response received');
      } catch (err) {
        addMessage('assistant', 'Error: ' + err.message);
      }
    }
    
    boot();
  </script>
</body>
</html>

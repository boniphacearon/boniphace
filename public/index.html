<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>BONIPHACE - Your Personal AI Assistant</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-tertiary: #1c1c1c;
      --bg-hover: #262626;
      --border: #2a2a2a;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --accent: #6EE7B7;
      --accent-hover: #34D399;
      --accent-dim: rgba(110, 231, 183, 0.1);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --transition: all 0.2s ease;
    }
    
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    #app { display: flex; height: 100vh; }
    
    /* Sidebar */
    #sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      transition: var(--transition);
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-primary);
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(110, 231, 183, 0.3);
    }
    
    .nav-section { margin-bottom: 24px; }
    
    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding-left: 12px;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 4px 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-primary);
      text-align: left;
      font-size: 14px;
      transition: var(--transition);
      width: 100%;
    }
    
    .nav-item:hover { background: var(--bg-hover); }
    .nav-item.active { 
      background: var(--accent-dim); 
      color: var(--accent);
      border-left: 3px solid var(--accent);
    }
    
    .nav-icon { font-size: 18px; }
    
    .new-chat-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: var(--bg-primary);
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(110, 231, 183, 0.4);
    }
    
    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
    }
    
    .user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--bg-primary);
    }
    
    .user-details { flex: 1; }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-email { font-size: 12px; color: var(--text-secondary); }
    
    /* Main Content */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    #header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    
    .header-title {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header-actions { display: flex; gap: 12px; align-items: center; }
    
    .depth-toggle {
      display: flex;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .depth-btn {
      padding: 8px 16px;
      font-size: 13px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    
    .depth-btn.active {
      background: var(--accent);
      color: var(--bg-primary);
      font-weight: 600;
    }
    
    /* Chat Area */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: var(--bg-primary);
    }
    
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }
    
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: var(--bg-primary);
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(110, 231, 183, 0.3);
    }
    
    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .welcome-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    
    .suggestion-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      max-width: 800px;
      width: 100%;
    }
    
    .suggestion-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    
    .suggestion-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    
    .suggestion-icon { font-size: 24px; margin-bottom: 12px; }
    .suggestion-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .suggestion-desc { font-size: 13px; color: var(--text-secondary); }
    
    .messages-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .message {
      padding: 20px;
      border-radius: var(--radius);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      background: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
    }
    
    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    
    .message.user .message-avatar {
      background: var(--accent);
      color: var(--bg-primary);
    }
    
    .message.assistant .message-avatar {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: var(--bg-primary);
    }
    
    .message-role { font-size: 13px; font-weight: 600; color: var(--accent); }
    .message-time { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
    
    .message-content {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .message-content p { margin: 8px 0; }
    .message-content code {
      background: var(--bg-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 13px;
    }
    .message-content pre {
      background: var(--bg-primary);
      padding: 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--border);
    }
    .message-content pre code { background: none; padding: 0; }
    .message-content h1, .message-content h2, .message-content h3 { margin: 16px 0 8px; }
    .message-content ul, .message-content ol { margin: 8px 0 8px 24px; }
    .message-content a { color: var(--accent); text-decoration: none; }
    .message-content a:hover { text-decoration: underline; }
    
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s infinite ease-in-out;
    }
    
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    /* Input Area */
    #input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    
    .input-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: var(--transition);
    }
    
    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    
    #message-input {
      width: 100%;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 24px;
      max-height: 200px;
    }
    
    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    
    .input-tools { display: flex; gap: 8px; }
    
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .tool-btn:hover { background: var(--bg-hover); color: var(--accent); }
    
    .send-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: var(--bg-primary);
      border: none;
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(110, 231, 183, 0.4);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Dashboard */
    .dashboard-container { padding: 24px; overflow-y: auto; flex: 1; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
    }
    
    .stat-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    
    .stat-icon { font-size: 32px; margin-bottom: 12px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .stat-label { font-size: 13px; color: var(--text-secondary); }
    
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
    }
    
    .activity-list {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    
    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .activity-item:last-child { border-bottom: none; }
    
    .activity-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .activity-content { flex: 1; }
    .activity-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .activity-time { font-size: 12px; color: var(--text-secondary); }
    
    /* Memory */
    .memory-container { padding: 24px; overflow-y: auto; flex: 1; }
    
    .memory-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .memory-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    
    .memory-toggle input { cursor: pointer; }
    
    .btn {
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
    }
    
    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }
    
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    
    .btn-danger:hover { opacity: 0.9; }
    
    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .memory-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    
    .memory-content { flex: 1; font-size: 14px; line-height: 1.5; }
    .memory-category {
      font-size: 11px;
      padding: 4px 8px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 4px;
      margin-top: 8px;
      display: inline-block;
    }
    
    .memory-delete {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }
    
    /* Settings */
    .settings-container { padding: 24px; overflow-y: auto; flex: 1; }
    
    .settings-group {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .settings-group h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
    }
    
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .setting-item:last-child { border-bottom: none; }
    
    .setting-label { font-size: 14px; }
    .setting-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    
    .setting-control select, .setting-control input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
    }
    
    .setting-control select:focus, .setting-control input:focus {
      border-color: var(--accent);
    }
    
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .toggle-switch.active { background: var(--accent); }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: var(--transition);
    }
    
    .toggle-switch.active::after { left: 26px; }
    
    /* Views */
    .view { display: none; height: 100%; flex-direction: column; }
    .view.active { display: flex; }
    
    /* Mobile */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); }
      #chat-area { padding: 16px; }
      .messages-container { gap: 16px; }
      .message { padding: 16px; }
      #input-area { padding: 16px; }
      .suggestion-cards { grid-template-columns: 1fr; }
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }
    
    .hidden { display: none !important; }
  </style>
  
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="brand">
        <div class="brand-icon">B</div>
        BONIPHACE
      </div>
      
      <button class="new-chat-btn" onclick="newChat()">
        <span>✨</span> New Chat
      </button>
      
      <div class="nav-section">
        <div class="nav-label">Main</div>
        <button class="nav-item active" onclick="showView('chat', this)">
          <span class="nav-icon"></span> Chat
        </button>
        <button class="nav-item" onclick="showView('dashboard', this)">
          <span class="nav-icon">📊</span> Dashboard
        </button>
        <button class="nav-item" onclick="showView('memory', this)">
          <span class="nav-icon">🧠</span> Memory
        </button>
        <button class="nav-item" onclick="showView('settings', this)">
          <span class="nav-icon">⚙️</span> Settings
        </button>
      </div>
      
      <div class="sidebar-footer">
        <div class="use

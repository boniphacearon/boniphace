<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BoniphaceAI" />
  <meta name="description" content="BONIPHACE - Your Personal AI Assistant" />
  <title>BONIPHACE — Your Personal AI Assistant</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />

  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <!-- AUTH SCREEN (HIDDEN BY DEFAULT) -->
  <div id="auth-screen" class="screen" style="display:none;">
    <div class="auth-card">
      <h1>BONIPHACE</h1>
      <p class="tagline">Your Personal AI Assistant</p>
    </div>
  </div>

  <!-- MAIN APP (ACTIVE BY DEFAULT) -->
  <div id="app-screen" class="screen active">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg viewBox="0 0 512 512" width="32" height="32">
            <polygon points="256,20 470,140 470,372 256,492 42,372 42,140" fill="#6EE7B7"/>
            <text x="256" y="330" font-family="Arial" font-size="280" font-weight="900" text-anchor="middle" fill="#0a0a0a">B</text>
          </svg>
          <span>BONIPHACE</span>
        </div>
        <button id="new-chat-btn" class="icon-btn" title="New conversation">＋</button>
      </div>
      <div class="sidebar-section">
        <div class="section-title">Projects</div>
        <div id="projects-list" class="list"></div>
        <button id="new-project-btn" class="text-btn">+ New Project</button>
      </div>
      <div class="sidebar-section">
        <div class="section-title">Recent Chats</div>
        <div id="conversations-list" class="list"></div>
      </div>
      <div class="sidebar-footer">
        <button data-view="dashboard" class="nav-btn">📊 Dashboard</button>
        <button data-view="memory" class="nav-btn"> Memory</button>
        <button data-view="tools" class="nav-btn"> Tools</button>
        <button data-view="settings" class="nav-btn">⚙️ Settings</button>
      </div>
    </aside>

    <main id="main-content">
      <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn">☰</button>
        <div class="topbar-title"><span id="view-title">BONIPHACE — Your Personal AI Assistant</span></div>
        <div class="topbar-actions">
          <div class="depth-toggle" title="Answer depth">
            <button id="depth-simple" class="depth-btn active">Simple</button>
            <button id="depth-deep" class="depth-btn">Deep</button>
          </div>
          <button id="install-btn" class="icon-btn hidden" title="Install app">️</button>
        </div>
      </header>

      <section id="view-chat" class="view active">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <div class="composer-row">
            <label class="icon-btn file-label" title="Upload file">📎<input type="file" id="file-input" multiple hidden /></label>
            <button id="voice-btn" class="icon-btn" title="Voice input">🎤</button>
            <textarea id="message-input" placeholder="Ask BONIPHACE anything..." rows="1"></textarea>
            <button id="send-btn" class="send-btn" title="Send"></button>
          </div>
          <div id="attached-files" class="attached-files"></div>
        </div>
      </section>

      <section id="view-dashboard" class="view">
        <div class="dashboard">
          <h2>Dashboard</h2>
          <div class="cards">
            <div class="card"><h3>Recent Conversations</h3><div id="dash-conv"></div></div>
            <div class="card"><h3>Projects</h3><div id="dash-proj"></div></div>
            <div class="card"><h3>Recent Files</h3><div id="dash-files"></div></div>
            <div class="card"><h3>Memories</h3><div id="dash-memory"></div></div>
          </div>
        </div>
      </section>

      <section id="view-memory" class="view">
        <div class="panel">
          <h2>Memory</h2>
          <div class="memory-controls">
            <label><input type="checkbox" id="memory-toggle" /> Enable memory</label>
            <button id="clear-memory-btn" class="btn-danger">Clear All</button>
          </div>
          <div id="memory-list" class="list memory-list"></div>
        </div>
      </section>

      <section id="view-tools" class="view">
        <div class="panel">
          <h2>Connected Tools</h2>
          <p class="muted">Tools BONIPHACE can use on your behalf.</p>
          <div id="tools-list" class="list"></div>
        </div>
      </section>

      <section id="view-settings" class="view">
        <div class="panel">
          <h2>Settings</h2>
          <div class="settings-group">
            <h3>AI</h3>
            <label>Response style <select id="set-style"><option value="professional">Professional</option><option value="friendly">Friendly</option><option value="concise">Concise</option></select></label>
            <label>Language <select id="set-lang"><option value="en">English</option><option value="sw">Kiswahili</option><option value="auto">Auto (detect)</option></select></label>
          </div>
          <div class="settings-group">
            <h3>Voice</h3>
            <label><input type="checkbox" id="set-voice" /> Enable voice input</label>
            <label><input type="checkbox" id="set-tts" /> Read answers aloud (TTS)</label>
          </div>
          <div class="settings-group">
            <h3>Account</h3>
            <p id="account-info"></p>
          </div>
          <button id="save-settings-btn" class="btn-primary">Save Settings</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
